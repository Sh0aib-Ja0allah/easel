name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: claude plugin validate . --strict
        run: claude plugin validate . --strict
      - name: claude plugin validate each plugin --strict
        run: |
          for d in plugins/*/; do
            echo "::group::$d"
            claude plugin validate "$d" --strict
            echo "::endgroup::"
          done
      - name: node --check every script
        run: |
          find . -type f \( -name '*.mjs' -o -name '*.js' \) -not -path '*/node_modules/*' -print0 | xargs -0 -r -n1 node --check
