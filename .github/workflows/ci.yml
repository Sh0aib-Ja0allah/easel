name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tree hygiene (no empty tracked file; no node_modules, easel-out, eval results or key files tracked; LF in the index)
        run: |
          fail=0
          empty=$(git ls-files -z | while IFS= read -r -d '' f; do if [ -f "$f" ] && [ ! -s "$f" ] && [ "${f##*/}" != .gitkeep ]; then printf '%s\n' "$f"; fi; done)
          if [ -n "$empty" ]; then echo "$empty" | sed 's/^/::error::empty tracked file (a truncated write?): /'; fail=1; fi
          never=$(git -c core.quotePath=false ls-files | grep -E '(^|/)(node_modules|easel-out)/|(^|/)evals/results/|(^|/)\.env$|\.(keystore|jks|pem|p12|pfx)$' || true)
          if [ -n "$never" ]; then echo "$never" | sed 's/^/::error::must never be committed: /'; fail=1; fi
          crlf=$(git -c core.quotePath=false ls-files --eol | grep -E '^i/(crlf|mixed)' || true)
          if [ -n "$crlf" ]; then echo "$crlf" | sed 's/^/::error::CRLF in the index (.gitattributes keeps text LF): /'; fail=1; fi
          exit $fail
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: claude plugin validate . --strict
        run: claude plugin validate . --strict
      - name: claude plugin validate each plugin --strict
        run: |
          for d in plugins/*/; do
            echo "::group::$d"
            claude plugin validate "$d" --strict
            for sub in skills agents commands; do
              if [ -d "$d$sub" ]; then claude plugin validate "$d$sub" --strict; fi
            done
            echo "::endgroup::"
          done
      - name: node --check every script
        run: |
          # kit/score-head.js and score-tail.js are fragments that wrap a piece's score; tools/build.mjs
          # compiles them inside every built piece (easel-motion tests).
          find . -type f \( -name '*.mjs' -o -name '*.js' \) -not -path '*/node_modules/*' -not -path './plugins/easel-motion/kit/score-*.js' -print0 | xargs -0 -r -n1 node --check

  node20:
    # The root README promises Node 20+ for easel-core (engine/package.json: engines >=20); the other jobs
    # run Node 22. The suites cannot run here as they are: `node --test "test/*.test.mjs"` relies on
    # the test runner expanding the glob, which Node 20 does not. So this checks the runtime on 20
    # cheaply: every script parses, and the engine and media MCP servers start and answer over stdio.
    # (easel-pixel needs Node 22.6+ for its bridge package and says so.)
    name: node 20 (runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: node --check every script on Node 20
        run: |
          node --version | tee node-version.txt
          grep -q '^v20\.' node-version.txt
          find . -type f \( -name '*.mjs' -o -name '*.js' \) -not -path '*/node_modules/*' -not -path './plugins/easel-motion/kit/score-*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Engine and media MCP servers on Node 20 (initialize, tools/list, one tool call each)
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          list='{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          printf '%s\n' "$init" "$list" '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"ping","arguments":{}}}' \
            | node plugins/easel-core/engine/server.mjs | tee engine.out
          grep -q '"protocolVersion":"2025-06-18"' engine.out
          grep -q '"name":"render_video"' engine.out
          grep -q 'pong' engine.out
          grep -q 'v20\.' engine.out
          printf '%s\n' "$init" "$list" '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"providers","arguments":{}}}' \
            | node plugins/easel-ai-media/server/server.mjs | tee media.out
          grep -q '"protocolVersion":"2025-06-18"' media.out
          grep -q '"name":"generate"' media.out
          grep '"id":3,' media.out | grep -q '"isError":false'
          node plugins/easel-core/engine/cli.mjs ping | grep -q '"node": "v20\.'

  engine:
    name: engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The data folder lives under runner.temp (a path with a space): actions/cache rejects paths
      # with '..', and the runner context is not available in job-level env.
      - name: Data folder (with a space in its path)
        run: echo "EASEL_DATA=$RUNNER_TEMP/easel data" >> "$GITHUB_ENV"
      - name: Install ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1
      - name: Cache engine data (npm packages + Chromium)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/easel data
          key: easel-data-${{ runner.os }}-${{ hashFiles('plugins/easel-core/engine/package.json') }}
      - name: doctor --install (into a data folder with a space)
        run: node plugins/easel-core/engine/cli.mjs doctor --install
      - name: Engine tests (render tests must not be skipped)
        run: |
          npm --prefix plugins/easel-core/engine test 2>&1 | tee engine-test.txt
          test "${PIPESTATUS[0]}" -eq 0
          grep -q 'skipped 0' engine-test.txt
      - name: easel-motion tests (build + every style through the engine; must not be skipped)
        env:
          # Full-length demo renders on Linux; a 1 s clip per style elsewhere (same code path, faster).
          EASEL_MOTION_FULL: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          npm --prefix plugins/easel-motion test 2>&1 | tee motion-test.txt
          test "${PIPESTATUS[0]}" -eq 0
          grep -q 'skipped 0' motion-test.txt
      - name: easel-design tests (skills, systems, palette tool, every example through the engine; must not be skipped)
        run: |
          npm --prefix plugins/easel-design test 2>&1 | tee design-test.txt
          test "${PIPESTATUS[0]}" -eq 0
          grep -q 'skipped 0' design-test.txt
      - name: easel-illustrate tests (skills, the SVG checker, every example and the p5.js loop through the engine; must not be skipped)
        run: |
          npm --prefix plugins/easel-illustrate test 2>&1 | tee illustrate-test.txt
          test "${PIPESTATUS[0]}" -eq 0
          grep -q 'skipped 0' illustrate-test.txt
      - name: easel-ai-media tests (provider server with synthetic fixtures and no network, consent gate, assembly with ffmpeg, skills and settings; must not be skipped)
        run: |
          npm --prefix plugins/easel-ai-media test 2>&1 | tee media-test.txt
          test "${PIPESTATUS[0]}" -eq 0
          grep -q 'skipped 0' media-test.txt
      - name: easel-pixel tests (launcher with a stand-in package, hooks, skills and settings; no Aseprite; must not be skipped)
        run: |
          npm --prefix plugins/easel-pixel test 2>&1 | tee pixel-test.txt
          test "${PIPESTATUS[0]}" -eq 0
          grep -q 'skipped 0' pixel-test.txt
      - name: MCP smoke (initialize + tools/list over stdio)
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node plugins/easel-core/engine/server.mjs | tee mcp.out
          grep -q '"protocolVersion":"2025-06-18"' mcp.out
          grep -q '"name":"render_video"' mcp.out
      - name: CLI smoke (1 s video from the GSAP fixture)
        run: |
          printf '{"file":"plugins/easel-core/engine/test/fixtures/anim-gsap.html","duration":1,"outDir":"smoke-out","preset":"ultrafast"}' > smoke.json
          node plugins/easel-core/engine/cli.mjs render_video --json @smoke.json
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames,width,height -of csv=p=0 smoke-out/video.mp4 | tee probe.txt
          grep -q '640,360,30' probe.txt
      - name: Upload rendered goldens on failure (for review)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens-${{ runner.os }}
          path: |
            plugins/easel-core/engine/test/golden/
            plugins/easel-motion/test/golden/
          if-no-files-found: ignore

  install:
    # T5.5: a clean install of the marketplace as users add it (from GitHub, so it tests the pushed
    # commit on main), each plugin used from its installed copy. Push to main only.
    name: clean install (${{ matrix.os }})
    if: github.event_name == 'push'
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
      - name: Install Claude Code CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      # The marketplace installs whatever main is now. If a newer push already moved main, that
      # push's own run checks it; this run says so instead of testing a different commit.
      - name: Is this commit still the head of main?
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "current=false" >> "$GITHUB_OUTPUT"; echo "::notice::main is now $head; the clean install of that commit runs in its own CI run"; fi
      - name: Install every plugin into an empty config and use each installed copy
        if: steps.head.outputs.current == 'true'
        run: node scripts/install-check.mjs --source "${{ github.repository }}" --work "$RUNNER_TEMP/easel install check" --expect-sha "$GITHUB_SHA"
      - name: Upload the install report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-check-${{ runner.os }}
          path: ${{ runner.temp }}/easel install check/install-check.json
          if-no-files-found: ignore
