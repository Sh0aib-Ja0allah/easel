<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tallyfern: Bills (mobile)</title>
<style>
  /* ---- Tokens (clean-product system) ---- */
  :root {
    --primary: #2F5BEA; --primary-hover: #2449C4; --primary-press: #1E3DA6;
    --bg: #FFFFFF; --surface: #F5F7FA; --text: #14171F; --muted: #5B6472;
    --border: #DFE3EA; --border-strong: #8A93A3;
    --success: #1F8A5B; --success-text: #1A7550; /* #1F8A5B is 4.3:1 on white: fine for marks, too light for small text */ --error: #C8372D; --error-bg: #FCEEEC;
    --disabled-bg: #EEF1F5; --disabled-text: #5B6472;
    --radius: 8px; --radius-card: 12px;
    --sans: "Inter"; --mono: "JetBrains Mono";
  }
  html, body { margin: 0; background: var(--bg); }
  * { box-sizing: border-box; }

  /* ---- Components (identical in component-states.html) ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 16px; border-radius: var(--radius); border: 1px solid transparent;
    font: 700 15px/1 var(--sans); white-space: nowrap; cursor: pointer;
    transition: background-color 150ms ease-out, box-shadow 150ms ease-out;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover, .btn-primary.is-hover { background: var(--primary-hover); box-shadow: 0 2px 6px rgba(20, 23, 31, 0.16); }
  .btn-primary:active { background: var(--primary-press); box-shadow: none; }
  .btn:focus-visible, .btn.is-focus { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn:disabled { background: var(--disabled-bg); color: var(--disabled-text); border: 1px dashed var(--border-strong); cursor: not-allowed; box-shadow: none; }
  .btn[aria-busy="true"] { cursor: progress; }
  .btn .spin { width: 16px; height: 16px; flex: none; }
  .btn-quiet { background: var(--bg); color: var(--text); border-color: var(--border-strong); }
  .btn-quiet:hover, .btn-quiet.is-hover { background: var(--surface); border-color: var(--text); }
  .btn svg { flex: none; }

  .field { display: grid; gap: 6px; }
  .field label { font: 400 14px/1.3 var(--sans); color: var(--text); }
  .input {
    width: 100%; height: 40px; padding: 0 12px; border-radius: var(--radius);
    border: 1px solid var(--border-strong); background: var(--bg);
    font: 400 16px/1 var(--sans); color: var(--text);
  }
  .input::placeholder { color: var(--muted); opacity: 1; }
  .input:focus-visible { outline: 2px solid var(--primary); outline-offset: 0; border-color: var(--primary); }
  .input[aria-invalid="true"] { border-color: var(--error); border-width: 2px; padding: 0 11px; }
  .input:disabled { background: var(--disabled-bg); color: var(--disabled-text); border-style: dashed; cursor: not-allowed; }
  .input-mono { font-family: var(--mono); }
  .hint { font: 400 13px/1.4 var(--sans); color: var(--muted); margin: 0; }
  .hint.error { color: var(--error); display: flex; gap: 6px; align-items: flex-start; font-weight: 400; }
  .hint.error svg { flex: none; margin-top: 1px; }

  .card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 20px; display: grid; gap: 16px; }
  .card-head { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; }
  .card-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--surface); display: grid; place-items: center; }
  .card h3 { margin: 0; font: 700 17px/1.25 var(--sans); color: var(--text); }
  .card .meta { margin: 2px 0 0; font: 400 14px/1.3 var(--sans); color: var(--muted); }
  .badge { font: 700 12px/1 var(--sans); padding: 6px 8px; border-radius: 999px; background: var(--surface); color: var(--text); border: 1px solid var(--border); white-space: nowrap; }
  .amount { display: flex; align-items: baseline; justify-content: space-between; }
  .amount b { font: 400 28px/1 var(--mono); color: var(--text); letter-spacing: -0.02em; }
  .amount span { font: 400 14px/1 var(--sans); color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--success); border-radius: 3px; }
  .people { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .people li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; font: 400 14px/1.3 var(--sans); color: var(--text); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--sans); background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .paid { color: var(--success-text); font-weight: 700; display: inline-flex; gap: 4px; align-items: center; }
  .owed { color: var(--error); font-weight: 700; }
  .card-actions { display: flex; gap: 12px; align-items: center; }
  .link { font: 700 15px/1 var(--sans); color: var(--primary); text-decoration: underline; text-underline-offset: 3px; }

  .skeleton .sk { display: block; background: var(--border); border-radius: 6px; }
  .skeleton .card-icon { background: var(--border); }
  @media (prefers-reduced-motion: no-preference) { .skeleton .sk { animation: pulse 1.6s ease-in-out infinite; } }
  @keyframes pulse { 50% { opacity: 0.55; } }

  /* ---- Touch sizing: same components, 48px targets ---- */
  .screen .btn { height: 48px; font-size: 16px; padding: 0 20px; }
  .screen .input { height: 48px; font-size: 16px; }

  /* ---- Screen layout (390 x 844) ---- */
  .screen { width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--surface); font-family: var(--sans); color: var(--text); display: flex; flex-direction: column; }
  .status { height: 47px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px 0 32px; font: 700 16px/1 var(--sans); }
  .status svg { display: block; }
  .top { padding: 4px 20px 0; display: flex; justify-content: space-between; align-items: start; }
  .top h1 { margin: 0; font: 700 28px/1.2 var(--sans); letter-spacing: -0.02em; }
  .top p { margin: 4px 0 0; font-size: 15px; line-height: 1.4; color: var(--muted); }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); display: grid; place-items: center; flex: none; }
  .content { padding: 16px 20px 0; display: grid; gap: 16px; }
  .section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 0 -4px; }
  .section-title h2 { margin: 0; font: 700 15px/1.3 var(--sans); }
  .section-title span { font-size: 14px; color: var(--muted); }
  .rows { list-style: none; margin: 0; padding: 0 16px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-card); }
  .rows li { display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: 52px; font-size: 16px; }
  .rows li + li { border-top: 1px solid var(--border); }
  .rows b { font: 400 16px/1 var(--mono); }
  .rows small { display: block; font-size: 13px; color: var(--success-text); font-weight: 700; margin-top: 3px; }
  .dock { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); }
  .dock .cta { padding: 12px 20px; }
  .dock .cta .btn { width: 100%; }
  nav.tabs { display: flex; justify-content: space-around; height: 56px; }
  nav.tabs a { min-width: 72px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 400 12px/1 var(--sans); color: var(--muted); text-decoration: none; }
  nav.tabs a[aria-current="page"] { color: var(--primary); font-weight: 700; }
  .home-ind { height: 34px; display: grid; place-items: center; }
  .home-ind i { width: 134px; height: 5px; border-radius: 3px; background: var(--text); }
</style>
</head>
<body>
<div class="screen">
  <div class="status" aria-hidden="true">
    <span>9:41</span>
    <svg width="68" height="12" viewBox="0 0 68 12" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="8" width="3" height="4" rx="1" fill="#14171F"/><rect x="5" y="6" width="3" height="6" rx="1" fill="#14171F"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#14171F"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#14171F"/><path d="M26 4.5a9 9 0 0 1 12 0M28.5 7a5 5 0 0 1 7 0" fill="none" stroke="#14171F" stroke-width="1.6" stroke-linecap="round"/><circle cx="32" cy="10" r="1.4" fill="#14171F"/><rect x="43.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#14171F"/><rect x="45.5" y="2.5" width="15" height="7" rx="1.5" fill="#14171F"/><rect x="65.5" y="4" width="2" height="4" rx="1" fill="#14171F"/></svg>
  </div>

  <header class="top">
    <div><h1>Flat 4B bills</h1><p>March · £214.60 across 3 bills</p></div>
    <button class="icon-btn" type="button" aria-label="Flatmates and settings"><svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="10" cy="7" r="3.2" fill="none" stroke="#14171F" stroke-width="1.6"/><path d="M3.5 17c1-3.2 3.6-4.8 6.5-4.8s5.5 1.6 6.5 4.8" fill="none" stroke="#14171F" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </header>

  <main class="content">
    <div class="field"><label for="q">Find a bill</label><input id="q" class="input" type="search" placeholder="Name, month or flatmate"></div>

    <article class="card" aria-label="Electricity bill">
      <div class="card-head">
        <div class="card-icon"><svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M11.5 1.5 4 11h5l-1 7.5L15.5 9h-5z" fill="none" stroke="#14171F" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
        <div><h3>Electricity</h3><p class="meta">Due 28 Mar</p></div>
        <span class="badge">2 of 3 paid</span>
      </div>
      <div class="amount"><b>£86.40</b><span>£28.80 each</span></div>
      <div class="bar" role="img" aria-label="2 of 3 shares paid"><i style="width: 66.7%"></i></div>
      <ul class="people">
        <li><span class="avatar">JM</span><span>Jonah Mills</span><span class="owed">Owes £28.80</span></li>
      </ul>
      <div class="card-actions"><button class="btn btn-quiet" type="button">Remind Jonah</button><a class="link" href="#bill-electricity">View bill</a></div>
    </article>

    <div class="section-title"><h2>Settled this month</h2><span>2 bills</span></div>
    <ul class="rows">
      <li><span>Broadband<small>Settled 3 Mar</small></span><b>£32.00</b></li>
      <li><span>Water, Q1<small>Settled 9 Mar</small></span><b>£96.20</b></li>
    </ul>
  </main>

  <div class="dock">
    <div class="cta"><button class="btn btn-primary" type="button">Add a bill</button></div>
    <nav class="tabs" aria-label="Main">
      <a href="#bills" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" fill="#2F5BEA"/><path d="M9 8h6M9 12h6" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/></svg><span>Bills</span></a>
      <a href="#activity"><svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4" fill="none" stroke="#5B6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Activity</span></a>
      <a href="#flatmates"><svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="9" cy="9" r="3" fill="none" stroke="#5B6472" stroke-width="1.6"/><circle cx="16.5" cy="10" r="2.4" fill="none" stroke="#5B6472" stroke-width="1.6"/><path d="M3.5 19c.8-3 2.9-4.5 5.5-4.5s4.7 1.5 5.5 4.5M15 14.6c2.6-.3 4.6 1 5.3 4.4" fill="none" stroke="#5B6472" stroke-width="1.6" stroke-linecap="round"/></svg><span>Flatmates</span></a>
    </nav>
    <div class="home-ind" aria-hidden="true"><i></i></div>
  </div>
</div>
</body>
</html>
