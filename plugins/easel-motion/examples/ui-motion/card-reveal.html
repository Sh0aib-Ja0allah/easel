<!doctype html>
<!-- Easel example (MIT): a GSAP card reveal as a paused timeline the engine can seek (HyperFrames
     composition format). GSAP is loaded from its CDN URL; the Easel engine serves its local copy. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card reveal</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f1ea; font-family: "Inter", sans-serif; }
  #stage { position: relative; width: 1280px; height: 720px; display: grid; place-items: center; overflow: hidden; }
  .card { width: 520px; padding: 40px 44px; border-radius: 24px; background: #fff; box-shadow: 0 30px 60px rgba(40, 30, 20, 0.12); }
  .card h1 { margin: 0 0 12px; font: 700 44px/1.1 "Space Grotesk", sans-serif; color: #1d1a17; }
  .card p { margin: 0 0 28px; font-size: 22px; line-height: 1.45; color: #4a443d; }
  .row { display: flex; gap: 12px; }
  .chip { padding: 10px 18px; border-radius: 999px; background: #1d1a17; color: #f4f1ea; font-size: 18px; font-weight: 700; }
  .chip.alt { background: #e9e2d4; color: #1d1a17; }
  @media (prefers-reduced-motion: reduce) { .card, .card > *, .chip { opacity: 1 !important; transform: none !important; } }
</style>
</head>
<body>
<div id="stage" data-composition-id="card" data-duration="1.6" data-width="1280" data-height="720" data-fps="30">
  <div class="card">
    <h1>Motion with a job</h1>
    <p>The card rises, then its contents follow a beat later, so the eye lands on the title first.</p>
    <div class="row"><span class="chip">Get started</span><span class="chip alt">Learn more</span></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  // Enter: ease-out; the card first (400 ms), its contents staggered 60 ms a beat later.
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.out' } });
  if (!reduce) {
    tl.from('.card', { y: 40, opacity: 0, scale: 0.98, duration: 0.4 })
      .from('.card h1, .card p', { y: 16, opacity: 0, duration: 0.3, stagger: 0.06 }, 0.15)
      .from('.chip', { y: 10, opacity: 0, duration: 0.25, stagger: 0.06 }, 0.35);
  }
  window.__timelines = { card: tl };
  window.__ready = true;
</script>
</body>
</html>
