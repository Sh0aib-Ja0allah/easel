<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  BLANK PIECE: 6.0 s @ 120 BPM, 24 fps, any format. Two eras joined by a hero-to-hero morph; the scenes
//  call only the style's STYLE hooks (backdrop, hero) and core helpers, so this runs in any style.
//  Replace the scenes with your piece's, drawn with the style's own kit.
//  Build: node <easel-motion>/tools/build.mjs <this piece dir>.
// =====================================================================
const FORMATS = { '9:16': [1080, 1920], '4:5': [1080, 1350], '1:1': [1080, 1080], '16:9': [1920, 1080] };
// the format: ?format=16:9 in a browser; the Easel engine says which one it renders in window.__easel.aspect
const FORMAT = new URLSearchParams(location.search).get('format') || (window.__easel && window.__easel.aspect) || '9:16';   // the piece's main format first
const FPS = 24, [W, H] = FORMATS[FORMAT];
{ const cv = document.getElementById('c'); cv.width = W; cv.height = H; }
// a supplied music track: tools/beats.mjs writes beats.json and build.mjs injects it as BEATS (see SKILL.md -> Music)
const BPM = typeof BEATS !== 'undefined' ? BEATS.bpm : 120, GRID0 = typeof BEATS !== 'undefined' ? BEATS.offset : 0;
const BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;   // at 120 BPM: 0.5 / 0.25 / 0.125s = 12 / 6 / 3 frames
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
// the platform UI per format (9:16: keep content in x 60–940, y 250–1500)
const SAFE = { '9:16': { top: 240, bottom: 420, right: 140 }, '4:5': { top: 80, bottom: 160, right: 60 }, '1:1': { top: 60, bottom: 110, right: 60 }, '16:9': { top: 60, bottom: 110, right: 60 } }[FORMAT];
const HAND = '"Caveat", cursive';   // bundled OFL font (easel-core/fonts): the same on every OS
const CX = (W - SAFE.right) / 2;                              // caption centre (left of the right-hand UI strip on 9:16)

// onBeat(t): the nearest 8th of the grid — the song's when a track is supplied (BEATS), else 120 BPM from 0.
// Put every cut, morph and big cue on it, so a supplied track only shifts them to its own beats.
const onBeat = (t) => +(GRID0 + Math.round((t - GRID0) / E8) * E8).toFixed(4);
const M1 = onBeat(3.0);                                      // the morph: the hero moves from one world to the next
// eras: [t0, t1, scene]. Boundaries with a BRIDGE (src/bridges.js) morph; the rest are hard cuts.
const ERA_LIST = [[0, M1, () => sceneOne()], [M1, DURATION, () => sceneTwo()]];
const SHOTS = [
  //  key        era  t0    t1        title
  ['one',        0,   0.0,  M1,       'the first world'],
  ['two',        1,   M1,   DURATION, 'the second world'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: FORMAT,
  format: 'morph-chain',   // 'F2' adds the fixed-stage checks (a year counter, a still stage); 'F4' adds the mission checks
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],              // hard cuts (seconds, on the 8th grid)
  morphs: [M1],          // morph bridge centres (seconds, on the 8th grid)
  cues: { hop: onBeat(1.0), arrive: onBeat(4.0) },
  acts: [
    { name: '1 One', role: 'build', t0: 0.0, t1: M1 },
    { name: '2 Two', role: 'gift',  t0: M1, t1: DURATION },
  ],
  // the storyboard: one key frame per beat
  board: [
    { t: 1.5, title: 'the first world', sound: 'a soft pad', next: 'the hero carries us over' },
    { t: 5.0, title: 'the second world', sound: 'a warm chord', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
