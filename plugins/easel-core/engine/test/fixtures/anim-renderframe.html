<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1b1714}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// The animate-kit contract: window.TIMELINE (size, fps, duration), window.renderFrame(t) draws the
// exact frame for t, window.renderAudioWav() returns the score as a base64 WAV, and a format-aware
// page reads window.__easel.aspect. Main format here: 640x360.
// Easel: the FORMATS table, the WAV writer and the base64 loop are adapted from cth9191/animate
// @ 7e5eb56feb2dd573f890e1b7b34748af43d58263 (github.com/cth9191/animate,
// plugins/animate/skills/animate/templates/piece/src/head.html, kit/score-head.js, kit/score-tail.js).
// MIT License, Copyright (c) 2026 cth9191; full text in plugins/easel-core/NOTICE.md.
const FORMATS = { '16:9': [1920, 1080], '9:16': [1080, 1920], '1:1': [1080, 1080], '4:5': [1080, 1350] };
const ASPECT = (window.__easel && window.__easel.aspect) || null;
const [W, H] = ASPECT ? FORMATS[ASPECT] : [640, 360];
const FPS = 10, DURATION = 2;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
window.TIMELINE = { width: W, height: H, fps: FPS, duration: DURATION, frames: FPS * DURATION, aspect: ASPECT || 'main' };
function renderFrame(t, canvas) {
  const g = (canvas || cv).getContext('2d');
  g.fillStyle = '#1b1714'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#f2aa4c'; g.fillRect((t / DURATION) * (W - 80), H / 2 - 40, 80, 80);
  g.fillStyle = '#ffffff'; g.font = `700 ${Math.round(H / 10)}px 'Space Grotesk'`; g.fillText(`${ASPECT || 'main'} t=${t.toFixed(1)}`, 24, H / 6);
}
window.renderFrame = renderFrame;
// A quiet 440 Hz tone (about -29 LUFS) so the engine's mastering has work to do.
window.renderAudioWav = async () => {
  const sr = 48000, n = sr * DURATION, buf = new ArrayBuffer(44 + n * 4), v = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { const s = Math.round(Math.sin(2 * Math.PI * 440 * i / sr) * 0.05 * 32767); v.setInt16(44 + i * 4, s, true); v.setInt16(46 + i * 4, s, true); }
  const bytes = new Uint8Array(buf); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};
</script>
</body>
</html>
