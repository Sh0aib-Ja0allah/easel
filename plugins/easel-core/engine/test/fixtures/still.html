<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #f4efe6; --fg: #1d2a33; --accent: #d1603d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14181c; --fg: #f1ece4; --accent: #f08a5d; } }
  html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: grid; place-items: center; font-family: Inter, sans-serif; }
  .card { width: 80%; }
  h1 { font: 700 40px/1.1 'Space Grotesk', sans-serif; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { font: 400 18px/1.4 'Newsreader', serif; margin: 0 0 12px; }
  code { font: 400 15px 'JetBrains Mono', monospace; color: var(--accent); }
  .bar { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--accent), #e9c46a); margin-top: 14px; }
  #rand { font: 400 13px 'JetBrains Mono', monospace; opacity: .7; }
</style>
</head>
<body>
  <div class="card">
    <h1>Easel golden frame</h1>
    <p>Bundled OFL fonts: Space Grotesk, Newsreader, Inter and JetBrains Mono.</p>
    <code>render_still → PNG</code>
    <div class="bar"></div>
    <div id="rand"></div>
  </div>
  <script>document.getElementById('rand').textContent = 'seeded ' + Math.random().toFixed(6);</script>
</body>
</html>
