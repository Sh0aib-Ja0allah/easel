<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:Inter,sans-serif;background:#fff;color:#111}
.tag{width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:18px}
.card{position:absolute;left:20px;top:80px;width:200px;height:40px;overflow:hidden}
.card p{margin:0;font-size:16px;line-height:24px}
.off{position:absolute;left:560px;top:20px;font-size:32px;white-space:nowrap}
</style></head><body>
<div class="tag">An extremely long product name that cannot fit</div>
<div class="card"><p>First line fits. Second line is hidden below the card edge and third too.</p></div>
<div class="off">Headline running off the frame</div>
</body></html>
