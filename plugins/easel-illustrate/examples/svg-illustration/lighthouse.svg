<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-labelledby="lh-title lh-desc">
  <title id="lh-title">A small coastal lighthouse at dusk</title>
  <desc id="lh-desc">A red and white lighthouse on a rocky islet glows against a violet and peach evening sky; the setting sun on the left lights the tower's left side and its lamp throws a soft beam across the calm sea.</desc>
  <!-- Light: the low sun at the left (x 170, on the horizon) is the key light, so the tower's
       left side is lit and its cast shadow falls right; the lamp adds a warm glow of its own.
       Layers back to front: sky, sun, far land, sea, haze, islet, tower, beams, grain, vignette.
       Horizon y 390. Tower centre x 470, base y 440, top of the body y 232. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="390" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#17143a"/>
      <stop offset="0.28" stop-color="#352a62"/>
      <stop offset="0.52" stop-color="#6f3f7a"/>
      <stop offset="0.72" stop-color="#c4647c"/>
      <stop offset="0.88" stop-color="#f2a06c"/>
      <stop offset="1" stop-color="#fcd590"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="170" cy="392" r="260" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffe6b0" stop-opacity="0.9"/>
      <stop offset="0.2" stop-color="#ffc483" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f59a77" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f59a77" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="388" x2="0" y2="600" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#e49a7a"/>
      <stop offset="0.12" stop-color="#a86a88"/>
      <stop offset="0.35" stop-color="#5a4678"/>
      <stop offset="0.7" stop-color="#2a2858"/>
      <stop offset="1" stop-color="#141739"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="320" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9c9a4" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#f9c9a4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f9c9a4" stop-opacity="0"/>
    </linearGradient>
    <!-- islet: warm rim on the sun side, cool violet on the far side (never black) -->
    <linearGradient id="rock" x1="290" y1="0" x2="668" y2="0" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#b56a74"/>
      <stop offset="0.22" stop-color="#7f4a6c"/>
      <stop offset="0.5" stop-color="#4a3060"/>
      <stop offset="0.8" stop-color="#2d1f4a"/>
      <stop offset="1" stop-color="#3a2856"/>
    </linearGradient>
    <linearGradient id="rock-v" x1="0" y1="436" x2="0" y2="562" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1a4e" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a1a4e" stop-opacity="0.55"/>
    </linearGradient>
    <!-- five-zone light across the tower (x 422..518): light, specular, half-tone, form shadow,
         core shadow, then reflected light at the far edge -->
    <linearGradient id="tower-light" x1="422" y1="0" x2="518" y2="0" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffcf9c" stop-opacity="0.35"/>
      <stop offset="0.17" stop-color="#fff4dc" stop-opacity="0.55"/>
      <stop offset="0.36" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#3a2a6e" stop-opacity="0.32"/>
      <stop offset="0.86" stop-color="#2d1b4e" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#5b3d78" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="dome" x1="440" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#d9675c"/>
      <stop offset="0.25" stop-color="#b6434a"/>
      <stop offset="0.65" stop-color="#6e2a48"/>
      <stop offset="1" stop-color="#3a1d44"/>
    </linearGradient>
    <radialGradient id="lantern" cx="470" cy="199" r="30" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#fff2c2"/>
      <stop offset="0.7" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f3a35a"/>
    </radialGradient>
    <radialGradient id="lamp-halo" cx="470" cy="199" r="170" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
      <stop offset="0" stop-color="#fff0c0" stop-opacity="0.75"/>
      <stop offset="0.15" stop-color="#ffd98e" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#ffb877" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffb877" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam-l" x1="470" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1c4" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffe0a0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffe0a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam-r" x1="470" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1c4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffe0a0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.5"/>
    </radialGradient>
    <clipPath id="tower-clip"><path d="M422 440 L439 232 L501 232 L518 440 Z"/></clipPath>
    <clipPath id="rock-clip"><path d="M290 540 C305 505 340 478 380 462 C410 450 440 438 470 436 C505 434 545 444 580 462 C615 480 640 505 668 540 C640 552 600 558 560 556 C500 560 420 562 360 556 C330 553 305 548 290 540 Z"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="linearRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft-lg" x="-30%" y="-60%" width="160%" height="220%" color-interpolation-filters="linearRGB">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%" color-interpolation-filters="linearRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <g id="background">
    <rect width="800" height="600" fill="url(#sky)"/>
    <g fill="#fff8e8">
      <circle cx="64" cy="48" r="1.3" opacity="0.8"/>
      <circle cx="148" cy="96" r="0.9" opacity="0.6"/>
      <circle cx="262" cy="34" r="1.1" opacity="0.7"/>
      <circle cx="350" cy="78" r="0.8" opacity="0.5"/>
      <circle cx="612" cy="40" r="1.4" opacity="0.85"/>
      <circle cx="700" cy="104" r="0.9" opacity="0.55"/>
      <circle cx="752" cy="30" r="1" opacity="0.7"/>
      <circle cx="560" cy="118" r="0.8" opacity="0.45"/>
    </g>
    <rect width="800" height="600" fill="url(#sun-glow)"/>
    <circle cx="170" cy="392" r="30" fill="#ffe7b4"/>
    <!-- far land: desaturated, light, blue-violet shifted -->
    <path d="M520 391 C566 382 604 368 650 369 C700 370 736 358 800 354 L800 392 L520 392 Z" fill="#7a5486" opacity="0.6"/>
    <path d="M0 386 C36 380 76 381 112 388 L112 392 L0 392 Z" fill="#8a5c86" opacity="0.5"/>
  </g>

  <g id="midground">
    <rect y="388" width="800" height="212" fill="url(#sea)"/>
    <!-- sun reflection: a broken column of warm strokes that thins with distance from the horizon -->
    <g fill="#ffd9a6">
      <rect x="132" y="394" width="76" height="3" rx="1.5" opacity="0.7"/>
      <rect x="140" y="402" width="58" height="2.5" rx="1.2" opacity="0.6"/>
      <rect x="128" y="410" width="70" height="2.5" rx="1.2" opacity="0.5"/>
      <rect x="146" y="420" width="44" height="2.5" rx="1.2" opacity="0.45"/>
      <rect x="138" y="432" width="56" height="2" rx="1" opacity="0.38"/>
      <rect x="152" y="446" width="34" height="2" rx="1" opacity="0.3"/>
      <rect x="144" y="462" width="44" height="2" rx="1" opacity="0.24"/>
      <rect x="158" y="482" width="24" height="2" rx="1" opacity="0.18"/>
      <rect x="150" y="506" width="34" height="2" rx="1" opacity="0.13"/>
    </g>
    <!-- swell lines -->
    <g stroke="#f6c9b0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.22">
      <path d="M30 430 q20 -3 40 0"/><path d="M250 444 q24 -4 48 0"/><path d="M680 436 q22 -3 44 0"/>
      <path d="M60 492 q30 -5 60 0"/><path d="M706 498 q30 -5 60 0"/><path d="M220 528 q34 -5 68 0"/>
      <path d="M560 590 q40 -6 80 0"/><path d="M40 572 q36 -5 72 0"/>
    </g>
    <rect y="320" width="800" height="110" fill="url(#haze)"/>

    <!-- the islet's reflection, squashed and faint -->
    <path d="M300 548 C360 560 440 566 520 564 C590 562 640 552 660 546 C620 574 560 590 480 592 C400 592 340 576 300 548 Z" fill="#1a1a4e" opacity="0.35" filter="url(#soft)"/>
    <!-- the lamp's reflection on the water -->
    <g fill="#ffe6b0">
      <rect x="456" y="570" width="28" height="2.5" rx="1.2" opacity="0.35"/>
      <rect x="462" y="580" width="16" height="2" rx="1" opacity="0.28"/>
      <rect x="452" y="590" width="34" height="2" rx="1" opacity="0.2"/>
    </g>

    <!-- islet -->
    <path d="M290 540 C305 505 340 478 380 462 C410 450 440 438 470 436 C505 434 545 444 580 462 C615 480 640 505 668 540 C640 552 600 558 560 556 C500 560 420 562 360 556 C330 553 305 548 290 540 Z" fill="url(#rock)"/>
    <g clip-path="url(#rock-clip)">
      <rect x="280" y="430" width="400" height="140" fill="url(#rock-v)"/>
      <!-- strata cracks -->
      <g stroke="#1e1640" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.45">
        <path d="M340 500 C370 494 392 498 420 492"/>
        <path d="M520 488 C548 494 570 504 600 500"/>
        <path d="M400 528 C430 522 470 526 500 520"/>
        <path d="M560 530 C590 526 612 532 640 528"/>
      </g>
      <!-- cast shadow of the tower, thrown right and down the slope (coloured, soft) -->
      <path d="M512 440 L640 476 L660 500 L520 452 Z" fill="#2d1b4e" opacity="0.45" filter="url(#soft)"/>
    </g>
    <!-- warm rim where the sun catches the islet's top edge -->
    <path d="M296 532 C310 502 342 478 380 462 C410 450 440 438 470 436" fill="none" stroke="#ffb88a" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    <!-- foam at the waterline -->
    <g stroke="#ffe9dc" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M294 542 q14 4 28 1 q14 -3 28 2"/>
      <path d="M392 557 q18 3 36 0"/>
      <path d="M540 556 q16 3 32 0 q16 -3 30 -4"/>
      <path d="M640 545 q12 -2 26 -6"/>
    </g>
  </g>

  <!-- the lamp's halo and beams: in the air behind the tower, so they light the sky and not the
       gallery in front of them -->
  <g id="lamp-light">
    <circle cx="470" cy="199" r="170" fill="url(#lamp-halo)"/>
    <path d="M470 192 L40 140 L40 262 L470 206 Z" fill="url(#beam-l)" filter="url(#soft-lg)"/>
    <path d="M470 194 L760 176 L760 220 L470 204 Z" fill="url(#beam-r)" filter="url(#soft-lg)"/>
  </g>

  <g id="foreground">
    <!-- keeper's cottage, on the shadow side -->
    <g>
      <path d="M536 460 L536 436 L584 436 L584 466 Z" fill="#3f2a58"/>
      <path d="M530 438 L560 416 L590 438 Z" fill="#6e2a48"/>
      <path d="M530 438 L560 416 L566 420 L540 438 Z" fill="#b34a52" opacity="0.8"/>
      <rect x="556" y="444" width="11" height="10" rx="1" fill="#ffd27a"/>
      <rect x="556" y="444" width="11" height="10" rx="1" fill="#ffd27a" filter="url(#soft)" opacity="0.7"/>
    </g>

    <!-- contact shadow at the tower base -->
    <ellipse cx="474" cy="449" rx="66" ry="5" fill="#1a1a4e" opacity="0.55"/>
    <!-- stone plinth -->
    <path d="M410 450 L534 450 L528 437 L416 437 Z" fill="#6b5578"/>
    <path d="M410 450 L452 450 L452 437 L416 437 Z" fill="#c49090" opacity="0.6"/>

    <!-- tower body: white with red bands, then the five-zone light overlay -->
    <g clip-path="url(#tower-clip)">
      <rect x="420" y="230" width="100" height="212" fill="#f4ece4"/>
      <g fill="#c8433f">
        <rect x="420" y="252" width="100" height="34"/>
        <rect x="420" y="320" width="100" height="36"/>
        <rect x="420" y="390" width="100" height="38"/>
      </g>
      <rect x="420" y="230" width="100" height="212" fill="url(#tower-light)"/>
      <!-- reflected light: warm bounce from the sea on the far edge -->
      <rect x="508" y="230" width="10" height="212" fill="#f6a77f" opacity="0.18" filter="url(#soft)"/>
      <!-- specular streak on the lit side -->
      <rect x="436" y="236" width="5" height="200" fill="#fffaf0" opacity="0.45" filter="url(#soft)"/>
      <!-- door and two small windows -->
      <path d="M462 440 L462 418 Q470 408 478 418 L478 440 Z" fill="#2d1b4e"/>
      <rect x="465" y="300" width="9" height="13" rx="4.5" fill="#2d1b4e"/>
      <rect x="466" y="366" width="9" height="13" rx="4.5" fill="#2d1b4e"/>
      <!-- the lamp's warm light falling on the top of the tower -->
      <ellipse cx="470" cy="232" rx="50" ry="22" fill="#ffd98e" opacity="0.35" filter="url(#soft)"/>
    </g>

    <!-- gallery and railing -->
    <rect x="428" y="222" width="84" height="10" rx="2" fill="#2b2147"/>
    <rect x="428" y="222" width="30" height="3" rx="1.5" fill="#c08a8a" opacity="0.6"/>
    <g stroke="#2b2147" stroke-width="1.6" stroke-linecap="round">
      <line x1="430" y1="206" x2="510" y2="206"/>
      <line x1="432" y1="206" x2="432" y2="222"/><line x1="446" y1="206" x2="446" y2="222"/>
      <line x1="494" y1="206" x2="494" y2="222"/><line x1="508" y1="206" x2="508" y2="222"/>
    </g>
  </g>

  <g id="effects">
    <!-- lantern room -->
    <rect x="448" y="178" width="44" height="44" fill="url(#lantern)"/>
    <circle cx="470" cy="199" r="9" fill="#ffffff" filter="url(#glow)"/>
    <g stroke="#2b2147" stroke-width="2">
      <line x1="448" y1="178" x2="448" y2="222"/>
      <line x1="462" y1="178" x2="462" y2="222" stroke-width="1.2" opacity="0.7"/>
      <line x1="478" y1="178" x2="478" y2="222" stroke-width="1.2" opacity="0.7"/>
      <line x1="492" y1="178" x2="492" y2="222"/>
    </g>
    <!-- dome, lit from the left, cool on the right -->
    <path d="M442 180 Q444 152 470 146 Q496 152 498 180 Z" fill="url(#dome)"/>
    <path d="M450 172 Q452 158 466 152" fill="none" stroke="#ffd2b0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <rect x="440" y="177" width="60" height="4" rx="2" fill="#2b2147"/>
    <line x1="470" y1="146" x2="470" y2="132" stroke="#2b2147" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="470" cy="130" r="3" fill="#2b2147"/>
    <!-- underside of the gallery picks up the lamp -->
    <rect x="448" y="221" width="44" height="2" fill="#ffe2a0" opacity="0.6"/>

    <!-- two gulls -->
    <g fill="none" stroke="#2b2147" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M300 214 q7 -7 13 0 q6 -7 13 0"/>
      <path d="M338 246 q5 -5 10 0 q5 -5 10 0"/>
    </g>

    <!-- grain over everything, very light -->
    <rect width="800" height="600" fill="#000000" filter="url(#grain)" opacity="0.07"/>
    <!-- vignette last, navy not black -->
    <rect width="800" height="600" fill="url(#vignette)"/>
  </g>
</svg>
