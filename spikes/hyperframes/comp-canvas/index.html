<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<!-- Spike T0.4: original cut-paper style scene on canvas, drawn from a paused GSAP timeline. -->
<script src="gsap.min.js"></script>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #efe6d6; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
  <canvas id="c" class="clip" data-start="0" data-duration="5" data-track-index="0" width="1280" height="720"></canvas>
</div>
<script>
  // Seeded PRNG (mulberry32): no Math.random, no Date, no requestAnimationFrame.
  function prng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const W = 1280, H = 720;
  const g = document.getElementById('c').getContext('2d');
  const rnd = prng(20261011);

  // Paper grain, generated once from the seed.
  const grain = document.createElement('canvas');
  grain.width = W; grain.height = H;
  const gg = grain.getContext('2d');
  for (let i = 0; i < 9000; i++) {
    gg.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,0.035)' : 'rgba(255,255,255,0.05)';
    gg.fillRect(rnd() * W, rnd() * H, 1 + rnd() * 2, 1 + rnd() * 2);
  }

  // Hill layers with torn edges: a fixed list of jittered points per layer.
  const palette = ['#c96f53', '#e09f3e', '#7a9e7e', '#335c67', '#1f3b44'];
  const layers = palette.map((color, i) => {
    const base = 300 + i * 85, amp = 70 - i * 8, pts = [];
    for (let x = -200; x <= W + 700; x += 22) {
      pts.push([x, base - Math.sin(x / (180 + i * 40) + i) * amp + (rnd() - 0.5) * 7]);
    }
    return { color, pts, speed: 18 + i * 22 };
  });

  function paperPath(pts, dx) {
    g.beginPath();
    g.moveTo(pts[0][0] + dx, H + 10);
    for (const [x, y] of pts) g.lineTo(x + dx, y);
    g.lineTo(pts[pts.length - 1][0] + dx, H + 10);
    g.closePath();
  }

  function draw(t) {
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#efe6d6'; g.fillRect(0, 0, W, H);
    // Sun rises along an arc.
    const sy = 420 - t * 46;
    g.save(); g.shadowColor = 'rgba(40,30,20,0.25)'; g.shadowBlur = 10; g.shadowOffsetY = 6;
    g.fillStyle = '#f2c14e'; g.beginPath(); g.arc(880, sy, 74, 0, Math.PI * 2); g.fill(); g.restore();
    // Layers slide at different speeds (parallax), each with a cut-paper drop shadow.
    layers.forEach((L, i) => {
      const dx = -L.speed * t + Math.sin(t * 1.3 + i) * 6;
      g.save();
      g.shadowColor = 'rgba(30,20,10,0.35)'; g.shadowBlur = 12; g.shadowOffsetY = 8;
      g.fillStyle = L.color; paperPath(L.pts, dx); g.fill();
      g.restore();
    });
    // A paper boat bobbing on the front layer.
    const bx = 260 + t * 120, by = 610 + Math.sin(t * 4) * 8;
    g.save(); g.translate(bx, by); g.rotate(Math.sin(t * 4 + 0.6) * 0.08);
    g.shadowColor = 'rgba(30,20,10,0.35)'; g.shadowBlur = 8; g.shadowOffsetY = 5;
    g.fillStyle = '#f7f3ea';
    g.beginPath(); g.moveTo(-70, 0); g.lineTo(70, 0); g.lineTo(46, 30); g.lineTo(-46, 30); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(-6, -4); g.lineTo(-6, -86); g.lineTo(44, -12); g.closePath(); g.fill();
    g.restore();
    g.drawImage(grain, 0, 0);
  }

  const state = { t: 0 };
  const tl = gsap.timeline({ paused: true, onUpdate: () => draw(tl.time()) });
  tl.to(state, { t: 5, duration: 5, ease: 'none' }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
  window.renderAt = (t) => { tl.seek(t, false); draw(t); };
  tl.seek(0); draw(0);
  window.__ready = true;
</script>
</body>
</html>
